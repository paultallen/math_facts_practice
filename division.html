<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Division</h1>
    <p class="score" id="score">Score: 0 / 0</p>

    <div class="problem" id="problem"></div>

    <form id="answer-form">
      <input type="number" id="answer-input" inputmode="numeric" autocomplete="off">
      <button type="submit">Check</button>
    </form>

    <p class="feedback" id="feedback"></p>

    <button id="next-button" class="hidden">Next problem</button>

    <a class="back-link" href="index.html">&larr; Back to menu</a>
  </div>

  <script src="script.js"></script>
  <script>
    function generateDivisionProblem() {
      const a = randomInt(2, 12);
      const b = randomInt(2, 12);
      const product = a * b;
      return { display: `${product} ÷ ${a}`, answer: b };
    }

    startQuiz(generateDivisionProblem);
  </script>
</body>
</html>
