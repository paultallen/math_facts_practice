<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Addition &amp; Subtraction Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Addition &amp; Subtraction</h1>
    <p class="score" id="score">Score: 0 / 0</p>

    <div class="problem" id="problem"></div>

    <form id="answer-form">
      <input type="number" id="answer-input" inputmode="numeric" autocomplete="off">
      <button type="button" id="sign-toggle">&plusmn;</button>
      <button type="submit">Check</button>
    </form>

    <p class="feedback" id="feedback"></p>

    <button id="next-button" class="hidden">Next problem</button>

    <a class="back-link" href="index.html">&larr; Back to menu</a>
  </div>

  <script src="script.js"></script>
  <script>
    function generateAddSubProblem() {
      const limit = 20;
      let a, b, op, answer;
      do {
        a = randomInt(-limit, limit);
        b = randomInt(-limit, limit);
        op = Math.random() < 0.5 ? '+' : '-';
        answer = op === '+' ? a + b : a - b;
      } while (answer < -limit || answer > limit);

      return { display: `${a} ${op} ${formatOperand(b)}`, answer };
    }

    startQuiz(generateAddSubProblem);
  </script>
</body>
</html>
